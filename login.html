<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Login - Mobile Addiction</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" type="text/css" href="css/bootstrap.css" />
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="css/font-awesome.min.css" rel="stylesheet" />

  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      background: radial-gradient(circle at center, #1b1454 0%, #080325 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Abstract shapes in the background for depth */
    .bg-shape-1 {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0, 187, 240, 0.3) 0%, rgba(0, 187, 240, 0) 70%);
      top: -100px;
      left: -100px;
      z-index: 1;
      border-radius: 50%;
    }

    .bg-shape-2 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(35, 26, 111, 0.4) 0%, rgba(35, 26, 111, 0) 70%);
      bottom: -150px;
      right: -150px;
      z-index: 1;
      border-radius: 50%;
    }

    .glass-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 450px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      padding: 40px;
      color: #ffffff;
      transition: all 0.3s ease;
    }

    .card-header {
      background: transparent;
      border-bottom: none;
      padding: 0 0 20px 0;
      text-align: center;
    }

    .card-header h2 {
      font-weight: 700;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }

    .card-header h2 span {
      color: #00bbf0;
    }

    .card-header p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
    }

    .tabs {
      display: flex;
      margin-bottom: 30px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 30px;
      padding: 5px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.6);
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tab-btn.active {
      background: #00bbf0;
      color: #ffffff;
      box-shadow: 0 5px 15px rgba(0, 187, 240, 0.4);
    }

    .form-group {
      margin-bottom: 25px;
      position: relative;
    }

    .form-group i {
      position: absolute;
      left: 15px;
      top: 45px;
      color: rgba(255, 255, 255, 0.5);
      transition: all 0.3s ease;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.8);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      color: #ffffff;
      padding: 12px 20px 12px 45px;
      height: auto;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: #00bbf0;
      box-shadow: 0 0 10px rgba(0, 187, 240, 0.3);
      color: #ffffff;
    }

    .form-control:focus + i {
      color: #00bbf0;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #00bbf0 0%, #007fa4 100%);
      border: none;
      color: #ffffff;
      font-weight: 600;
      padding: 12px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 187, 240, 0.3);
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 187, 240, 0.5);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .back-home:hover {
      color: #00bbf0;
    }

    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
    }

    .custom-toast {
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      border-left: 4px solid #00bbf0;
      color: #ffffff;
      min-width: 280px;
      border-radius: 5px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      padding: 15px 20px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: slideIn 0.3s ease forwards;
    }

    .custom-toast.error {
      border-left-color: #ff3366;
    }

    .custom-toast.success {
      border-left-color: #00ffcc;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes fadeOut {
      to {
        transform: translateY(-20px);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="bg-shape-1"></div>
  <div class="bg-shape-2"></div>

  <div class="toast-container" id="toastContainer"></div>

  <div class="glass-card">
    <div class="card-header">
      <h2>Mobile <span>Addiction</span></h2>
      <p id="formSubtitle">Sign in to manage submissions and configurations</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="loginTabBtn" onclick="setMode('login')">Sign In</button>
      <button class="tab-btn" id="signupTabBtn" onclick="setMode('signup')">Sign Up</button>
    </div>

    <!-- Login Form -->
    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter username" required />
        <i class="fa fa-user"></i>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter password" required />
        <i class="fa fa-lock"></i>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
    </form>

    <a href="index.html" class="back-home">
      <i class="fa fa-arrow-left" aria-hidden="true"></i> Back to Homepage
    </a>
  </div>

  <!-- jQuery & Bootstrap JS -->
  <script src="js/jquery-3.4.1.min.js"></script>
  <script>
    let mode = 'login'; // login or signup

    $(document).ready(function () {
      checkSignupStatus();
    });

    async function checkSignupStatus() {
      try {
        const response = await fetch('/api/signup-status');
        const result = await response.json();
        if (result.success && !result.signup_allowed) {
          document.getElementById('signupTabBtn').style.display = 'none';
          document.querySelector('.tabs').style.display = 'none';
          setMode('login');
        }
      } catch (err) {
        console.error('Error checking signup status:', err);
      }
    }

    function setMode(newMode) {
      mode = newMode;
      const loginBtn = document.getElementById('loginTabBtn');
      const signupBtn = document.getElementById('signupTabBtn');
      const subtitle = document.getElementById('formSubtitle');
      const submitBtn = document.getElementById('submitBtn');

      if (mode === 'login') {
        loginBtn.classList.add('active');
        signupBtn.classList.remove('active');
        subtitle.innerText = 'Sign in to manage submissions and configurations';
        submitBtn.innerText = 'Sign In';
      } else {
        loginBtn.classList.remove('active');
        signupBtn.classList.add('active');
        subtitle.innerText = 'Create a new administrator account';
        submitBtn.innerText = 'Sign Up';
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `custom-toast ${type}`;
      
      let icon = 'fa-info-circle';
      if (type === 'success') icon = 'fa-check-circle';
      if (type === 'error') icon = 'fa-exclamation-triangle';

      toast.innerHTML = `
        <div>
          <i class="fa ${icon}" aria-hidden="true" style="margin-right: 10px;"></i>
          <span>${message}</span>
        </div>
        <i class="fa fa-times" aria-hidden="true" style="cursor: pointer; margin-left: 15px;" onclick="this.parentElement.remove()"></i>
      `;
      
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.style.animation = 'fadeOut 0.5s ease forwards';
        setTimeout(() => {
          toast.remove();
        }, 500);
      }, 4000);
    }

    async function handleAuth(event) {
      event.preventDefault();
      
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showToast('Please fill in all fields', 'error');
        return;
      }

      const url = mode === 'login' ? '/api/login' : '/api/register';
      const submitBtn = document.getElementById('submitBtn');
      
      submitBtn.disabled = true;
      submitBtn.innerText = 'Processing...';

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();
        
        if (response.ok && result.success) {
          showToast(result.message, 'success');
          
          if (mode === 'login') {
            setTimeout(() => {
              window.location.href = result.redirect || '/admin.html';
            }, 1000);
          } else {
            // After signup, switch to login
            setMode('login');
            passwordInput.value = '';
            usernameInput.focus();
            showToast('Account created! Please login now.', 'success');
          }
        } else {
          showToast(result.message || 'An error occurred', 'error');
        }
      } catch (err) {
        showToast('Network error, please try again.', 'error');
        console.error(err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = mode === 'login' ? 'Sign In' : 'Sign Up';
      }
    }
  </script>
</body>

</html>
